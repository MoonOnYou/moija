<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>모이자 — 모임 참가 전 안내 · 선착순 (#23)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
  :root{--bg:#fff;--bg2:#f7f6f3;--bgi:#e6f1fb;--bgs:#eaf3de;--tx:#2c2c2a;--t2:#5f5e5a;--t3:#888780;--ti:#185fa5;--tw:#854f0b;--tg:#3b6d11;--tr:#a32d2d;--bd:rgba(0,0,0,0.12);}
  body{margin:0;background:#f1efe8;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;color:var(--tx);padding:32px 0;}
  .frame{margin:0 auto;width:360px;height:720px;background:var(--bg);border-radius:28px;border:0.5px solid var(--bd);overflow:hidden;display:flex;flex-direction:column;}
  .item{display:flex;gap:12px;}
  .item i{font-size:20px;width:24px;flex-shrink:0;}
  .lead{font-size:13px;font-weight:600;}
  .sub{font-size:11px;color:var(--t2);margin-top:1px;}
</style>
</head>
<body>
<div style="background:var(--bg2);padding:32px 0;max-width:680px;margin:0 auto;border-radius:12px;">
  <div class="frame">
    <div style="flex:none;height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:12px;font-weight:500;"><span>9:41</span><span style="display:flex;gap:6px;align-items:center;font-size:13px;"><i class="ti ti-signal-5g"></i><i class="ti ti-wifi"></i><i class="ti ti-battery-3"></i></span></div>
    <div style="flex:none;height:44px;display:flex;align-items:center;padding:0 16px;"><i class="ti ti-x" style="font-size:21px;color:var(--t2);"></i></div>
    <div style="flex:none;padding:4px 24px 16px;">
      <div style="width:52px;height:52px;border-radius:15px;background:var(--bgs);display:flex;align-items:center;justify-content:center;margin-bottom:14px;"><i class="ti ti-bolt" style="font-size:27px;color:var(--tg);"></i></div>
      <div style="font-size:21px;font-weight:700;line-height:1.3;">바로 참가하기 전에<br>확인해주세요</div>
      <div style="font-size:11px;color:var(--tg);margin-top:6px;font-weight:600;">선착순 모임 · 즉시 확정</div>
    </div>
    <div style="flex:1;overflow-y:auto;padding:4px 24px;display:flex;flex-direction:column;gap:18px;">
      <div class="item"><i class="ti ti-diamond" style="color:var(--ti);"></i><div><div class="lead">바로 참가하고 50 다이아를 사용해요</div><div class="sub">즉시 확정 + 채팅방 입장</div></div></div>
      <div class="item"><i class="ti ti-star" style="color:var(--tw);"></i><div><div class="lead">참여하면 멤버들이 내 매너점수를 매길 수 있어요</div></div></div>
      <div class="item"><i class="ti ti-clock-hour-4" style="color:var(--t2);"></i><div><div class="lead">모임이 끝난 뒤 48시간까지 채팅이 유지돼요</div><div class="sub">정산용</div></div></div>
      <div class="item"><i class="ti ti-alert-triangle" style="color:var(--tr);"></i><div><div class="lead">무단 이탈·노쇼·미정산은 제한을 받을 수 있어요</div><div class="sub">매너점수 하락 + 앱 이용 제한</div></div></div>
    </div>
    <div style="flex:none;padding:12px 22px 20px;border-top:0.5px solid var(--bd);">
      <div style="background:var(--tx);color:#fff;text-align:center;font-size:14px;font-weight:600;padding:15px;border-radius:12px;">동의하고 바로 참가하기 · 50 다이아</div>
      <div style="text-align:center;font-size:10px;color:var(--t3);margin-top:8px;">커뮤니티 규칙 · 이용약관에 동의합니다</div>
    </div>
  </div>
</div>
</body>
</html>

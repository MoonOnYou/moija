<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>모이자 — 다이아 충전</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
  :root { --color-background-primary:#fff; --color-background-secondary:#f7f6f3; --color-background-tertiary:#f1efe8; --color-background-info:#e6f1fb; --color-background-warning:#faeeda; --color-background-success:#eaf3de; --color-text-primary:#2c2c2a; --color-text-secondary:#5f5e5a; --color-text-tertiary:#888780; --color-text-info:#185fa5; --color-text-warning:#854f0b; --color-text-success:#3b6d11; --color-border-tertiary:rgba(0,0,0,0.15); --color-border-info:#b5d4f4; }
  body { margin: 0; background: var(--color-background-tertiary); font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; color: var(--color-text-primary); padding: 32px 0; }
  .pkg { border: 0.5px solid var(--color-border-tertiary); border-radius: 12px; padding: 14px; display: flex; align-items: center; gap: 12px; }
  .pkg-on { border: 2px solid var(--color-border-info); position: relative; }
</style>
</head>
<body>
<div style="background: var(--color-background-secondary); padding: 32px 0; max-width: 680px; margin: 0 auto; border-radius: 12px;">
  <div style="margin: 0 auto; width: 360px; height: 820px; background: var(--color-background-primary); border-radius: 28px; border: 0.5px solid var(--color-border-tertiary); overflow: hidden; position: relative;">
    <div style="position: absolute; top: 0; left: 0; right: 0; height: 32px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 12px; font-weight: 500;"><span>9:41</span><span style="display: flex; gap: 6px; align-items: center; font-size: 13px;"><i class="ti ti-signal-5g"></i><i class="ti ti-wifi"></i><i class="ti ti-battery-3"></i></span></div>
    <div style="position: absolute; top: 32px; left: 0; right: 0; height: 56px; display: flex; align-items: center; padding: 0 16px; border-bottom: 0.5px solid var(--color-border-tertiary);"><i class="ti ti-arrow-left" style="font-size: 22px;"></i><div style="flex: 1; text-align: center; font-size: 16px; font-weight: 500;">다이아 충전</div><div style="width: 22px;"></div></div>
    <div style="position: absolute; top: 88px; left: 0; right: 0; bottom: 90px; overflow-y: auto; padding: 20px;">
      <div style="background: var(--color-background-info); border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 24px;">
        <div style="font-size: 12px; color: var(--color-text-info); margin-bottom: 8px;">현재 보유</div>
        <div style="display: flex; align-items: center; justify-content: center; gap: 8px;"><i class="ti ti-diamond" style="font-size: 28px; color: var(--color-text-info);"></i><span style="font-size: 32px; font-weight: 500; color: var(--color-text-info);">1,000</span></div>
      </div>
      <div style="font-size: 14px; font-weight: 500; margin-bottom: 12px;">충전 패키지</div>
      <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px;">
        <div class="pkg"><i class="ti ti-diamond" style="font-size: 24px; color: var(--color-text-info);"></i><div style="flex: 1;"><div style="font-size: 15px; font-weight: 500;">1,000 다이아</div></div><div style="font-size: 14px; font-weight: 500;">₩1,000</div></div>
        <div class="pkg pkg-on"><div style="position: absolute; top: -9px; left: 14px; background: var(--color-background-info); color: var(--color-text-info); font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: 8px;">인기</div><i class="ti ti-diamond" style="font-size: 24px; color: var(--color-text-info);"></i><div style="flex: 1;"><div style="font-size: 15px; font-weight: 500;">3,300 다이아</div><div style="font-size: 11px; color: var(--color-text-success);">보너스 +300 (10%)</div></div><div style="font-size: 14px; font-weight: 500;">₩3,000</div></div>
        <div class="pkg"><i class="ti ti-diamond" style="font-size: 24px; color: var(--color-text-info);"></i><div style="flex: 1;"><div style="font-size: 15px; font-weight: 500;">5,750 다이아</div><div style="font-size: 11px; color: var(--color-text-success);">보너스 +750 (15%)</div></div><div style="font-size: 14px; font-weight: 500;">₩5,000</div></div>
        <div class="pkg"><i class="ti ti-diamond" style="font-size: 24px; color: var(--color-text-info);"></i><div style="flex: 1;"><div style="font-size: 15px; font-weight: 500;">12,000 다이아</div><div style="font-size: 11px; color: var(--color-text-success);">보너스 +2,000 (20%)</div></div><div style="font-size: 14px; font-weight: 500;">₩10,000</div></div>
      </div>
      <div style="background: var(--color-background-warning); border-radius: 12px; padding: 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
        <i class="ti ti-player-play" style="font-size: 22px; color: var(--color-text-warning);"></i>
        <div style="flex: 1;"><div style="font-size: 14px; font-weight: 500; color: var(--color-text-warning);">광고 보고 무료 충전</div><div style="font-size: 11px; color: var(--color-text-secondary);">15초 광고 시청 시 50 다이아</div></div>
        <div style="font-size: 12px; color: var(--color-text-warning); font-weight: 500; border: 0.5px solid var(--color-text-warning); border-radius: 12px; padding: 5px 12px;">받기</div>
      </div>
      <div style="background: var(--color-background-secondary); border-radius: 12px; padding: 14px;">
        <div style="font-size: 13px; font-weight: 500; margin-bottom: 10px;">다이아는 어디에 쓰나요?</div>
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;"><div style="font-size: 12px; color: var(--color-text-secondary); display: flex; align-items: center; gap: 6px;"><i class="ti ti-plus" style="font-size: 14px;"></i>모임 만들기</div><div style="font-size: 12px; font-weight: 500;">300 다이아</div></div>
        <div style="display: flex; align-items: center; justify-content: space-between;"><div style="font-size: 12px; color: var(--color-text-secondary); display: flex; align-items: center; gap: 6px;"><i class="ti ti-message-circle" style="font-size: 14px;"></i>채팅방 참가</div><div style="font-size: 12px; font-weight: 500;">50 다이아</div></div>
      </div>
    </div>
    <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 20px 20px; background: var(--color-background-primary); border-top: 0.5px solid var(--color-border-tertiary);"><div style="background: var(--color-text-primary); color: #fff; padding: 14px; border-radius: 12px; text-align: center; font-size: 15px; font-weight: 500;">₩3,000 결제하기</div></div>
  </div>
</div>
</body>
</html>
